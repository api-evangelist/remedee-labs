name: Remedee Labs
description: 'Remedee Labs is a French medical device company founded in 2016 in Grenoble that develops
  millimeter-wave neuromodulation solutions for chronic pain management. Its flagship product is the Remedee
  wrist bracelet, which stimulates nerve endings to trigger endorphin release, paired with the myRemedee
  companion app and human coaching. The company markets two subscription solutions, FibroRem for fibromyalgia
  and NoviRem for osteoarthritis pain. Surfaced as a portfolio company of Partech and added to the API
  Evangelist network; the product is consumer-facing and publishes no public developer API, SDK, or technical
  integration surface at this time.'
